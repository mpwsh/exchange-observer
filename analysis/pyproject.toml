[project]
name = "analysis"
version = "0.1.0"
description = "Post-hoc analysis of scheduler runs from Scylla report data."
requires-python = ">=3.11"
dependencies = [
    "cassandra-driver>=3.29",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "mplfinance>=0.12",
    "tomli>=2.0; python_version<'3.11'",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
