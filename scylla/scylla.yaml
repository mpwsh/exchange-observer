# Scylla storage config for 2026.1 (single-node dev setup)
#
# Trimmed from the Scylla 5.2 sample. Removed:
#  - Thrift/RPC 9160 options (Thrift is gone)
#  - Legacy request_scheduler options
#  - Comment blocks that don't affect behavior
#
# Anything left commented is left as a knob you can flip.

# The name of the cluster. This is mainly used to prevent machines in
# one logical cluster from joining another.
# You can NOT modify this value for an existing cluster.
#cluster_name: 'Test Cluster'

# Number of tokens (vnodes) assigned to this node.
num_tokens: 256

# Data / commitlog directories
data_file_directories:
    - /var/lib/scylla/data
commitlog_directory: /var/lib/scylla/commitlog

# commitlog_sync may be either "periodic" or "batch."
commitlog_sync: periodic
commitlog_sync_period_in_ms: 10000
commitlog_segment_size_in_mb: 32

# Seeds — for a single-node dev cluster, itself is fine.
seed_provider:
    - class_name: org.apache.cassandra.locator.SimpleSeedProvider
      parameters:
          - seeds: "127.0.0.1"

# For a container binding all interfaces is fine (docker isolates it).
listen_address: localhost
# broadcast_address: 1.2.3.4

# CQL native transport
native_transport_port: 9042
#native_transport_port_ssl: 9142

# Timeouts
read_request_timeout_in_ms: 5000
write_request_timeout_in_ms: 2000

# Snitch — matches cassandra-rackdc.properties (dc=DC1, rack=Rack1)
endpoint_snitch: GossipingPropertyFileSnitch

# Client-facing bind address
rpc_address: localhost

# REST / Prometheus APIs
api_port: 10000
api_address: 127.0.0.1
# prometheus_port: 9180
# prometheus_address: 0.0.0.0

# Batch guardrails
batch_size_warn_threshold_in_kb: 5
batch_size_fail_threshold_in_kb: 50

# Auth — off for local dev. Flip these on for anything real.
# authenticator: PasswordAuthenticator
# authorizer:    CassandraAuthorizer

# Partitioner (do NOT change on an existing cluster)
partitioner: org.apache.cassandra.dht.Murmur3Partitioner

# Concurrency
concurrent_reads: 32
concurrent_writes: 128
# concurrent_counter_writes: 32
concurrent_compactors: 16

# Commitlog cap. -1 = auto (proportional to memory).
commitlog_total_space_in_mb: -1

# Internode encryption / compression — off for local dev
# server_encryption_options:
#    internode_encryption: none
# internode_compression: none
# inter_dc_tcp_nodelay: false

# Running in a container: relax strict env checks.
# NOTE: the compose command line also passes --developer-mode 1, which
# is what actually takes effect at runtime. Leaving this here as docs.
# developer_mode: false

# Shard data distribution. Keep 12 for new clusters.
murmur3_partitioner_ignore_msb_bits: 12

# ---- Scylla 2026.x additions -------------------------------------------
#
# Tablets (default in 2026.x): tablet-based data distribution replaces
# vnode streaming for keyspaces created with NetworkTopologyStrategy.
# Enabled by default; uncomment to force off.
# enable_tablets: true
#
# Raft-based consistent topology / schema changes are on by default in
# 2026.x and cannot be disabled. No config knob needed.
