[package]
name = "producer"
version.workspace = true
edition.workspace = true
authors.workspace = true
resolver = "2"

[dependencies]
exchange-observer = { path = "../lib" }

# ---- logging / errors -----------------------------------------------------
log = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# ---- async runtime --------------------------------------------------------
tokio = { version = "1.40", default-features = false, features = [
  "io-std",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
  "io-util",
  "sync",
] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
futures-channel = "0.3"

# ---- websocket ------------------------------------------------------------
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
native-tls = "0.2"

# ---- http / market data lookup --------------------------------------------
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
url = "2.5"
crypto-markets = "1.3"
crypto-market-type = "1.1"

# ---- kafka / redpanda -----------------------------------------------------
rskafka = { version = "0.5", features = ["lz4"] }

# ---- serde / time ---------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
time = "0.3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
