# Ambient time is banned: all wall-clock/monotonic reads must flow through
# engine::Clock (LiveClock is the sanctioned adapter and carries the only
# `#[expect]`s). Enforced via `disallowed_methods = "deny"` in each crate's
# [lints.clippy] table.
#
# Deliberately NOT listed: `time::OffsetDateTime::now_utc` — used only for
# exchange request signing (HMAC timestamps must be true wall time; that is
# the execution boundary, which becomes the Executor port in a later
# refactor).
disallowed-methods = [
    { path = "chrono::Utc::now", reason = "use engine::Clock::now_utc instead of ambient time" },
    { path = "std::time::Instant::now", reason = "use engine::Clock::monotonic instead of ambient time" },
    { path = "tokio::time::Instant::now", reason = "use engine::Clock::monotonic instead of ambient time" },
]
